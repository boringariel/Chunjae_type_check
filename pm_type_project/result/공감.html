<!DOCTYPE html>
<html lang="ko">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>나랑 찰떡인 기획자 유형은::천재IT교육센터</title>
  <base href="/">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/common.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>
  <div class="wrapper">
    <div class="card">
      <span id="user-result" class="card__title"></span>
      <span class="card__title">"프로젝트 진행은 <br />MBTI 대문자 F처럼" </span>
      <p class="card__content">
        <center>
          <img src="/static/image/type_sympathy.webp" style="max-height: 180px;">
        </center>
      </p>
      <div style="display: flex; flex-direction: row; align-items: center; gap: 10px;">
        <image src="/static/image/document.webp" width=64px>
          <p>공감이 필요한데 문서가 문제예요? <br /> 회의 끝나면 뭘 해야할지 모르는게 약간의 단점 </p>
      </div>
      <p>"나 우울해서 빵 샀어 ㅠㅠ" 라는 말을 이해할 수 있는 당신! 좋은 기획자라면 공감능력이 무엇보다도 중요하다는 사실 아시나요? 원활한 협업을 도와두는 공감 능력은 어떤 자리에서도 빛날거예요★</p>
      <p>
        <b>한 줄 피드백: <br />"기획서 쓰는 법... 배워볼까요?" </b>
      </p>
      <!-- <center>
        <p>▼내가 기획자 소질이 있는지 궁금하다면▼</p>
      </center> -->
      <!-- <a href="https://www.genia.academy/pm">
        <button class="card__button">
          <span class="button-text">말보다 Figma가 먼저 나오는 <br />PM 교육과정 알아보기 </span>
        </button>
      </a> -->
      <button id="captureBtn" class="card__button">
        <span class="button-text">공유하기!</span>
      </button>
      <button class="card__button" onclick="startTest()">
        <span class="button-text">다시하기!</span>
      </button>
      </form>
    </div>
  </div>
  <script src="script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const userName = localStorage.getItem("user_name");
      const resultTitle = document.getElementById("user-result");
      if (userName && resultTitle) {
        resultTitle.textContent = `공감 과몰입형 PM인 ${userName}!`;
      }
    });
    document.addEventListener("DOMContentLoaded", () => {
      renderResult(); // DOM이 로드된 이후에 결과 출력
    });

    function startTest() {
      // 기존 점수 초기화
      if (localStorage.getItem("pm_score")) {
        localStorage.removeItem("pm_score");
      }
      // 첫 질문 페이지로 이동
      location.href = "index.html";
    }
    document.getElementById("captureBtn").addEventListener("click", async () => {
      const target = document.body; // 또는 document.getElementById("wrapper")
      try {
        const canvas = await html2canvas(target, {
          useCORS: true,
        });
        const dataURL = canvas.toDataURL("image/jpg");
        // 다운로드 링크 생성
        const link = document.createElement("a");
        link.href = dataURL;
        link.download = "result.jpg";
        // 사용자 행동으로 클릭 유도
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (err) {
        console.error("캡처 실패:", err);
        alert("이미지를 저장하는 데 실패했습니다.");
      }
    });
  </script>
</body>

</html>
