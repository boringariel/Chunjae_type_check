<body>
  <div class="wrapper">
    <image src="/static/image/main_character.webp" style="max-height: 180px;">
      <div class="card">
        <span class="card__title">나랑 찰떡인 <br />기획자 유형 알아보기 </span>
        <p class="card__content"> 5문항으로 알아보는 내 안의 기획자 마인드! <br /> 기획자가 아니라도 한번 해보세요! <br /> 내 안의 기획자는 어떤 성향일까요? </p>
        <form class="card__form">
          <input class="user_name" required type="text" placeholder="이름을 입력해 주세요" />
          <button type="button" class="card__button" onclick="startTest(event)">
            <span class="button-text">시작하기!</span>
          </button>
        </form>
      </div>
  </div>
</body>

</html>
<script>
  function startTest(event) {
    const input = document.querySelector("input.user_name");
    const name = input.value.trim();
    if (!name) {
      event.preventDefault();
      input.reportValidity(); // 툴팁 표시
      return; // 여기서 함수 종료 (정상)
    }
    // ↓ 입력이 있는 경우 이 코드가 실행돼야 함
    localStorage.setItem("user_name", name);
    location.href = "question.html?step=1";
  }
</script>
